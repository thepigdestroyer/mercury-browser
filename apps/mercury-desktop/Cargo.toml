# SPDX-License-Identifier: MPL-2.0
[package]
name = "mercury-desktop"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mercury-browser"
path = "src/main.rs"

[dependencies]
# a11y-1: the page tree reaches the window (`src/accessibility.rs`).
accesskit.workspace = true
# clipboard lane: the system clipboard pages use in a normal run (text only, `src/clipboard.rs`).
# Servo 0.8.0 already depends on arboard "3" through its `clipboard` feature, with the default
# features plus `wayland-data-control`; ours turns the defaults off (the image-data default stays
# in the build through Servo, so Cargo unifies the features and no extra crate is built).
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
backtrace.workspace = true
dirs.workspace = true
dpi.workspace = true
euclid.workspace = true
getrandom.workspace = true
gleam.workspace = true
glow.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
# settings-ui: the key panel of the Tab groups section (`src/settings/groups_panel.rs`).
mercury-appearance = { path = "../../crates/mercury-appearance" }
mercury-downloads = { path = "../../crates/mercury-downloads" }
mercury-filter-lists = { path = "../../crates/mercury-filter-lists" }
mercury-import = { path = "../../crates/mercury-import" }
# key-switcher: the state machine of the ⌥ group keys (`src/option_keys.rs` is the glue).
mercury-option-keys = { path = "../../crates/mercury-option-keys" }
# pdf-viewer: the PDF viewer's model and process protocol, and the PDFium backend with the helper process.
mercury-pdf = { path = "../../crates/mercury-pdf" }
mercury-pdfium = { path = "../../crates/mercury-pdfium" }
# passwords-ui
mercury-password-manager = { path = "../../crates/mercury-password-manager" }
mercury-passwords = { path = "../../crates/mercury-passwords" }
mercury-settings = { path = "../../crates/mercury-settings" }
mercury-store = { path = "../../crates/mercury-store" }
# a11y-1: the page node of the window grafts the page's tree through the patched Slint backend's own API (`slint::winit_030`
# re-exports only `WinitWindowAccessor`); `mercury-a11y` holds the per-tab routing.
i-slint-backend-winit = { version = "=1.17.1", default-features = false, features = ["accessibility"] }
mercury-a11y = { path = "../../crates/mercury-a11y" }
# tab-snapshots lane: small pictures of tabs for the Orbit view (`src/tab_snapshots.rs`).
mercury-tab-snapshots = { path = "../../crates/mercury-tab-snapshots" }
mercury-ui = { path = "../../crates/mercury-ui" }
rusqlite.workspace = true
serde_json.workspace = true
servo.workspace = true
slint.workspace = true
surfman.workspace = true
talaria-core = { path = "../../crates/talaria-core" }
talaria-servo = { path = "../../crates/talaria-servo" }
thiserror.workspace = true
# site-security: how addresses are shown, and parsing them for the site-information popover.
mercury-site-security = { path = "../../crates/mercury-site-security" }
# media-session lane: the page's host in Now Playing (url is already a workspace dependency);
# openurl.
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true

# The same objc2 generation as wgpu-hal 29's Metal backend (not winit's objc2 0.5 / objc2-metal 0.2).
# `objc2-app-kit` and `objc2-foundation`: `NSScreen.visibleFrame`, the screen area outside the menu
# bar and Dock (`window.screen.avail*`), and `deviceDescription` to find the monitor's screen.
# `NSOpenPanel` and the features after it, with `block2` and `NSURL`: the file chooser of
# `<input type=file>` (`src/controls/file_panel.rs`) and the bookmark file panels
# (`src/bookmarks/panel.rs`), shown as sheets with a completion block.
[target.'cfg(target_os = "macos")'.dependencies]
# media-session lane: `block2` also gives the `MPRemoteCommand` handlers their blocks.
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    # controls lane: the file panel; menus lane: the native menu bar (features muda already
    # enables in this build).
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    # passwords-ui: copying a user name or password.
    "NSPasteboard",
    "NSPasteboardItem",
    "NSSavePanel",
    "NSView",
    "NSWindow",
    "block2",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
# The system proxy settings (`SCDynamicStoreCopyProxies`), read once at start.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-system-configuration = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCDynamicStore",
    "SCDynamicStoreCopySpecific",
    "SCSchemaDefinitions",
] }

# The crash handler is compiled on macOS and Linux only, as in servoshell.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
signal-hook-registry.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
mercury-ui = { path = "../../crates/mercury-ui", features = ["test-support"] }
tempfile.workspace = true
# downloads-ui lane: a headless window for the quit question's keyboard test. Dev-only, so the
# application's Slint features are unchanged.
slint = { workspace = true, features = ["renderer-software"] }

[features]
# `--exit-by logout`: the browser sends itself the quit Apple event of a log-out. For tests
# only; never in a released build. `make lint` and `make check` turn it on (`--all-features`).
quit-diagnostics = []
# menus lane: `MERCURY_MENU_DIAGNOSTICS`, a read-back of the macOS menu bar for checks without
# input (docs/developer-guide/testing.md). Off in `make build-release` and the app bundle;
# `make check` and `make lint` compile it (`--all-features`).
menu-diagnostics = []
# import-ui lane: `--import-from` and `--import-snapshot` (docs in `cli.rs`). Never in a
# released build; `make lint`, `make check` and `make test` turn it on (`--all-features`).
# find lane: diagnostic command-line options (`--find`, `--find-steps`), never in released builds;
# `make lint` and `make test` turn them on with `--all-features`.
diagnostics = []
# passwords-ui: `MERCURY_PASSWORDS_DIAG_FILL`, a fill without the context menu in automated runs,
# to check the fill script (docs/developer-guide/passwords.md). Never in a released build.
passwords-diagnostics = []

[build-dependencies]
gl_generator = "0.14"
