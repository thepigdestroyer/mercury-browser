  <!-- Mercury Browser app icon, simplified for 16 and 32 px (and their @2x): no halo, a larger
       Sun and a heavier M, so the letter survives at menu size. See AppIcon.svg. -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#2A1F4F"/>
      <stop offset="1" stop-color="#0C0819"/>
    </linearGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="472" cy="452" r="400">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset="0.5" stop-color="#FFC04D"/>
      <stop offset="1" stop-color="#F06A28"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#plate)"/>
  <circle cx="512" cy="512" r="330" fill="url(#sun)"/>
  <g fill="none" stroke="#1E1233" stroke-width="65" stroke-linecap="round">
    <path d="M364.1,696 V352 C364.1,434.6 422.6,505.1 470.7,551.5"/>
    <path d="M659.9,696 V352 C659.9,434.6 601.4,505.1 553.3,551.5"/>
