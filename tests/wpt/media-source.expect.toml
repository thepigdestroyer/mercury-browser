#
# The known failures of the web-platform-tests `media-source/` tree on Mercury, and the contract of
# flip condition F3 of the MED-1b brief for `dom_media_source_enabled`: after a run of
# `scripts/dev/mse-window-run.sh wpt`, anything that differs from this file is reported (a new
# failure and an unexpected pass alike), and the share of passing subtests is quoted.
#
# How to read it: docs/developer-guide/mse-testing.md. Format (crates/mercury-devtools/src/mse_run/expect.rs):
#
#   [[test]]
#   path = "media-source/<file>"          # below the WPT root (.any.js and .window.js files by their .html page)
#   class = "dom"                         # mse-core | dom | player | engine-gap | test-bug | not-planned
#   reason = "why it fails"               # required, like the class: an entry without one is refused
#   issue = "https://..."                 # optional; F3 wants one for mse-core and dom entries in the core areas
#   skip = true                           # optional: not run (not-planned)
#   harness = "TIMEOUT"                   # optional: the expected harness status (default OK)
#   fail = ["subtest"]                    # expected FAIL; also timeout = [...], notrun = [...], precondition_failed = [...]
#
# A file with no entry must finish OK with every subtest PASS.
#
# STATUS: PROVISIONAL. Nothing has run against Mercury yet (the first window run is central). The entries
# below are the starting list of the MED-1b brief, D10: Servo PR #47269's `tests/wpt/meta/media-source/`
# (196 failing subtests, 38 files that time out or error; see sdd/med-1-logs/pr/47269.diff), which lists what
# Servo's own implementation of that PR fails. Mercury carries that PR's DOM but not its data path, so some
# entries will turn out to be unexpected passes (round 2b removes them) and failures that are not listed will
# appear (round 2b adds them with a class and a reason). The classes below are guessed from the file's area
# and are re-classed from the real failure. The WPT checkout is pinned in scripts/dev/fetch-mse-tools.sh
# (commit 42e27408, 22 Nov 2026); `idlharness.window.js` of the PR is `idlharness.any.html` there.

