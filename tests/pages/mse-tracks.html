<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSE tracks</title>
<style>
  /* Explicit colours: in dark mode Servo 0.8 gives unstyled text a light colour on a white canvas. */
  html { background: #ffffff; color: #000000; }
  body { font: 16px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 12px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { font-size: 13px; color: #444444; margin: 0 0 8px; }
  #sum { font: bold 18px/1.4 Menlo, monospace; margin: 4px 0 8px; }
  .line { font: 14px/1.45 Menlo, monospace; margin: 0; word-break: break-all; }
  .pass { color: #006400; }
  .fail { color: #b00000; font-weight: bold; }
  .info { color: #1a4f8b; }
  video { background: #202020; display: block; margin: 8px 0; }
</style>
</head>
<body>
<h1>MSE tracks</h1>
<p class="note">audioTracks and videoTracks of the source buffers and of the element: ids, kinds, addtrack, a quality switch, removal.</p>
<div id="sum">running</div>
<video id="v" width="320" height="180" muted playsinline></video>
<div id="out"></div>
<!--
  Mercury test page for Media Source Extensions (lane med-1b, round 2). Track lists (decision D6).
  NOT RUN yet: it is run centrally in a window (scripts/dev/mse-window-run.sh pages, or by hand). It needs a
  browser started with MERCURY_DEV_MSE=1 (the preference dom_media_source_enabled is off otherwise) and the
  fixtures of crates/mercury-mse-testkit/fixtures served by scripts/serve-tests.sh under /mse-fixtures/
  (override with ?fixtures=<base url>). Every check prints one line that starts with PASS or FAIL (INFO
  lines only print a value); the result is also in document.title, which ends with "(done)" when the page
  has finished. See docs/developer-guide/media-source.md.
  The fixtures are 8 s at 25 fps, red for the first 4 s and blue for the last 4 s, a key frame every 2 s.
-->
<script>
"use strict";
const params = new URLSearchParams(location.search);
const BASE = params.get("fixtures") || "/mse-fixtures/";
const TITLE = "MSE tracks";
const out = document.getElementById("out");
const video = document.getElementById("v");
let passed = 0, failed = 0;
function line(cls, text) { const d = document.createElement("div"); d.className = "line " + cls; d.textContent = text; out.appendChild(d); }
function check(name, ok, detail) {
  if (ok) { passed++; line("pass", "PASS " + name); } else { failed++; line("fail", "FAIL " + name + (detail !== undefined ? ": " + detail : "")); }
  return ok;
}
function info(text) { line("info", "INFO " + text); }
function finish(error) {
  if (error) { failed++; line("fail", "FAIL the page stopped: " + (error && error.stack || error)); }
  const text = passed + " PASS, " + failed + " FAIL";
  document.getElementById("sum").textContent = text;
  document.title = TITLE + ": " + text + " (done)";
}
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
function once(target, name, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { target.removeEventListener(name, handler); reject(new Error("timeout waiting for " + name)); }, ms || 10000);
    const handler = event => { clearTimeout(timer); resolve(event); };
    target.addEventListener(name, handler, { once: true });
  });
}
async function until(predicate, ms, what) {
  const end = performance.now() + (ms || 10000);
  while (!predicate()) { if (performance.now() > end) throw new Error("timeout waiting for " + what); await sleep(50); }
}
async function bytes(path) {
  const response = await fetch(BASE + path);
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return new Uint8Array(await response.arrayBuffer());
}
// Fragmented MP4: the initialization segment is everything before the first styp (or moof), each media
// segment starts at a styp (or at a moof that no styp precedes).
function splitMp4(b) {
  const view = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let init = null, current = -1, previous = ""; const segments = [];
  for (let p = 0; p + 8 <= b.length;) {
    let size = view.getUint32(p);
    const type = String.fromCharCode(b[p + 4], b[p + 5], b[p + 6], b[p + 7]);
    if (size === 1) size = Number(view.getBigUint64(p + 8)); else if (size === 0) size = b.length - p;
    if (size < 8) break;
    if (type === "styp" || (type === "moof" && previous !== "styp")) {
      if (init === null) init = b.subarray(0, p); else segments.push(b.subarray(current, p));
      current = p;
    }
    previous = type; p += size;
  }
  if (current >= 0) segments.push(b.subarray(current));
  return { init, segments };
}
async function fixture(path) { return splitMp4(await bytes(path)); }
const H264_LOW = 'video/mp4; codecs="avc1.42C00C"', H264_HIGH = 'video/mp4; codecs="avc1.42C01E"', AAC = 'audio/mp4; codecs="mp4a.40.2"';
async function openSource() {
  const mediaSource = new MediaSource();
  const url = URL.createObjectURL(mediaSource);
  video.src = url;
  await once(mediaSource, "sourceopen");
  return { mediaSource, url };
}
async function append(sourceBuffer, data) {
  sourceBuffer.appendBuffer(data);
  await once(sourceBuffer, "updateend");
}
function ranges(timeRanges) { const r = []; for (let i = 0; i < timeRanges.length; i++) r.push([+timeRanges.start(i).toFixed(3), +timeRanges.end(i).toFixed(3)]); return JSON.stringify(r); }
function meanColour() {
  try {
    const canvas = document.createElement("canvas"); canvas.width = 16; canvas.height = 9;
    const context = canvas.getContext("2d"); context.drawImage(video, 0, 0, 16, 9);
    const data = context.getImageData(0, 0, 16, 9).data; let r = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) { r += data[i]; b += data[i + 2]; }
    return { r: r / 144, b: b / 144 };
  } catch (error) { return null; }
}
const isRed = c => c && c.r > c.b + 60, isBlue = c => c && c.b > c.r + 60;
if (typeof MediaSource === "undefined") {
  check("MediaSource exists (start the browser with MERCURY_DEV_MSE=1)", false);
  finish();
} else {
  (async () => {
    function listen(list, name) {
      const events = [];
      list.addEventListener(name, event => events.push(event.track));
      return events;
    }
    const low = await fixture("fmp4/video-h264-low.mp4"), high = await fixture("fmp4/video-h264-high.mp4");
    const aac = await fixture("fmp4/audio-aac.mp4"), muxed = await fixture("fmp4/muxed-h264-aac.mp4");

    {
      const { mediaSource } = await openSource();
      const sbv = mediaSource.addSourceBuffer(H264_LOW);
      check("before any initialization segment the lists are empty",
        sbv.videoTracks.length === 0 && sbv.audioTracks.length === 0 && video.videoTracks.length === 0 && video.audioTracks.length === 0);
      const sbAdded = listen(sbv.videoTracks, "addtrack"), elementAdded = listen(video.videoTracks, "addtrack");
      await append(sbv, low.init);
      check("the video source buffer has one video track and no audio track", sbv.videoTracks.length === 1 && sbv.audioTracks.length === 0, sbv.videoTracks.length + " " + sbv.audioTracks.length);
      check("the element's videoTracks has the same track", video.videoTracks.length === 1 && video.videoTracks[0] === sbv.videoTracks[0]);
      await sleep(50);
      check("addtrack fired on the source buffer's list and on the element's list", sbAdded.length === 1 && elementAdded.length === 1, sbAdded.length + " " + elementAdded.length);
      check("the addtrack event names the track", sbAdded[0] === sbv.videoTracks[0] && elementAdded[0] === video.videoTracks[0]);
      const track = sbv.videoTracks[0];
      info("video track id=" + JSON.stringify(track.id) + " kind=" + JSON.stringify(track.kind) + " label=" + JSON.stringify(track.label) + " language=" + JSON.stringify(track.language) + " selected=" + track.selected);
      check("the track has a non-empty string id", typeof track.id === "string" && track.id.length > 0, track.id);
      check("getTrackById finds it", sbv.videoTracks.getTrackById(track.id) === track && video.videoTracks.getTrackById(track.id) === track);
      check("the only video track is selected", track.selected === true);
      check("the element has no audio track yet", video.audioTracks.length === 0);

      // A quality switch (a new initialization segment of the other rendition) keeps the count.
      await append(sbv, low.segments[0]);
      await append(sbv, high.init);
      await sleep(50);
      check("a quality switch keeps one video track in each list", sbv.videoTracks.length === 1 && video.videoTracks.length === 1, sbv.videoTracks.length + " " + video.videoTracks.length);
      check("the quality switch fires no addtrack", sbAdded.length === 1 && elementAdded.length === 1, sbAdded.length + " " + elementAdded.length);
      check("the track is still selected after the switch", sbv.videoTracks[0].selected === true);

      // A second source buffer with audio.
      const sba = mediaSource.addSourceBuffer(AAC);
      const audioAdded = listen(video.audioTracks, "addtrack"), audioRemoved = listen(video.audioTracks, "removetrack");
      const sbaRemoved = listen(sba.audioTracks, "removetrack");
      await append(sba, aac.init);
      check("the audio source buffer has one audio track", sba.audioTracks.length === 1 && sba.videoTracks.length === 0, sba.audioTracks.length + " " + sba.videoTracks.length);
      check("the element has one audio track and one video track", video.audioTracks.length === 1 && video.videoTracks.length === 1, video.audioTracks.length + " " + video.videoTracks.length);
      check("the audio track is enabled", sba.audioTracks[0].enabled === true);
      await sleep(50);
      check("addtrack fired on the element's audioTracks", audioAdded.length === 1, audioAdded.length);
      info("audio track id=" + JSON.stringify(sba.audioTracks[0].id) + " kind=" + JSON.stringify(sba.audioTracks[0].kind) + " language=" + JSON.stringify(sba.audioTracks[0].language));

      // The lists are informational: toggling the flag changes the flag and nothing else.
      const audioTrack = video.audioTracks[0];
      audioTrack.enabled = false;
      check("enabled can be set (informational: no effect on playback with one track)", audioTrack.enabled === false);
      audioTrack.enabled = true;

      // Removing the source buffer takes its track out of both lists.
      mediaSource.removeSourceBuffer(sba);
      await sleep(50);
      check("removeSourceBuffer empties the audio lists", sba.audioTracks.length === 0 && video.audioTracks.length === 0, sba.audioTracks.length + " " + video.audioTracks.length);
      check("removetrack fired on the element's audioTracks and on the buffer's list", audioRemoved.length === 1 && sbaRemoved.length === 1, audioRemoved.length + " " + sbaRemoved.length);
      check("the video track stays", video.videoTracks.length === 1 && sbv.videoTracks.length === 1);
    }

    // A muxed buffer carries one track of each kind.
    {
      const { mediaSource } = await openSource();
      const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42C00C, mp4a.40.2"');
      await append(sb, muxed.init);
      check("a muxed buffer has one audio and one video track", sb.audioTracks.length === 1 && sb.videoTracks.length === 1, sb.audioTracks.length + " " + sb.videoTracks.length);
      check("the element's lists match", video.audioTracks.length === 1 && video.videoTracks.length === 1, video.audioTracks.length + " " + video.videoTracks.length);
      check("the audio track is enabled and the video track selected", sb.audioTracks[0].enabled === true && sb.videoTracks[0].selected === true);
    }
  })().then(() => finish(), error => finish(error));
}
</script>
</body>
</html>
