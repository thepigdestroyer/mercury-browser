<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>compat-indexeddb: running</title>
<style>
  /* Explicit colours: in dark mode Servo 0.8 gives unstyled text a light colour on a white canvas. */
  html { background: #ffffff; color: #000000; }
  body { font: 16px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 16px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { font-size: 13px; color: #444444; margin: 0 0 8px; }
  #summary { font: bold 20px/1.4 Menlo, monospace; margin: 4px 0 8px; }
  .line { font: 14px/1.5 Menlo, monospace; margin: 0; word-break: break-all; }
  .pass { color: #006400; }
  .fail { color: #b00000; font-weight: bold; }
  .info { color: #1a4f8b; }
</style>
</head>
<body>
<!--
  Mercury test page for the IndexedDB lane (ED3, net-1 item 4): the sequence of servo/servo#47893 (web.whatsapp.com
  stops at "Loading your chats") as a script, without the network. It needs no server code, but IndexedDB needs a
  real origin: open it from the test server (scripts/serve-tests.sh), not from file://. For example
    mercury-browser --screenshot out.png --window-size 1000x900 http://127.0.0.1:<port>/pages/compat-indexeddb.html

  NOT RUN YET: this Mac's screen is locked, so no window run has been made and nothing here is claimed to work.
  The expected verdict on a build with the lane's changes is "compat-indexeddb: <n> PASS, 0 FAIL" in the title
  (it reads "compat-indexeddb: HANG" if a step does not finish in 10 seconds, which is how WhatsApp fails:
  forever, silently) and no line that starts with FAIL. INFO lines only print a value.

  What it replays, in this order:
    1. a Dexie-like schema: two object stores that reuse the index name "ts" (#47893 item 1, fixed in 0.8), a
       multiEntry index on an array field, a compound index;
    2. IDBIndex.get / getKey / getAll / getAllKeys / count with keys, ranges and a count limit; get() and
       getKey() without a key throw a DataError; the records of a multiEntry index (a tag appears once per
       record, duplicates collapse, a record without the field is not in the index);
    3. index cursors (#47893 items 3 and 4): next, prev, nextunique, prevunique, advance, continue,
       continuePrimaryKey, openKeyCursor, and a primaryKey that is defined at every step;
    4. IDBRequest.source: the store, the index or the cursor that made the request;
    5. IDBCursor.update() and delete() through an index cursor;
    6. IDBTransaction.commit() (then oncomplete fires, the data reads back, a second commit throws);
    7. an aborted upgrade (abort() in onupgradeneeded, then an exception in onupgradeneeded) must reach
       the page as an AbortError on the open request, not crash it (#47893 item 2), and a new open must
       upgrade again from version 0;
    8. IDBFactory.databases().
  Known gap, printed as INFO and not counted: a unique index is not enforced when a record is put (the
  records of an index are derived in script, see third_party/servo-script/dom/indexeddb/idbindex.rs).
-->
<h1>IndexedDB compatibility (the WhatsApp Web sequence)</h1>
<p class="note">PASS means the engine behaves as the specification says. A step that does not finish in 10 seconds is a FAIL.</p>
<div id="summary">running</div>
<div id="results"></div>
<script>
  "use strict";
  const results = document.getElementById("results");
  const summary = document.getElementById("summary");
  let passes = 0;
  let failures = 0;
  let finished = false;

  function line(kind, text) {
    const item = document.createElement("div");
    item.className = "line " + kind;
    item.textContent = kind.toUpperCase() + "  " + text;
    results.appendChild(item);
    if (kind === "pass") passes++;
    if (kind === "fail") failures++;
  }

  const show = (value) => JSON.stringify(value);
  function check(label, observed, expected) {
    const ok = show(observed) === show(expected);
    line(ok ? "pass" : "fail", label + " = " + show(observed) + (ok ? "" : " (expected " + show(expected) + ")"));
  }
  function inform(label, value) {
    line("info", label + " = " + (typeof value === "string" ? value : show(value)));
  }

  // Every step must finish: a promise that does not settle in `ms` is a failure with the step's name.
  function within(promise, label, ms = 10000) {
    let timer;
    const timeout = new Promise((resolve, reject) => {
      timer = setTimeout(() => reject(new Error("HANG: " + label + " did not finish in " + ms + " ms")), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }
  async function step(label, body) {
    try {
      await within(Promise.resolve().then(body), label);
    } catch (error) {
      line("fail", label + ": " + (error && error.message ? error.message : error));
      if (String(error && error.message).startsWith("HANG")) hung = true;
    }
  }
  let hung = false;

  // Runs `body(transaction)` and resolves with the transaction's completion (oncomplete), or rejects on abort.
  // The body issues its requests at once and keeps what it needs; callbacks do the rest, which keeps the
  // transaction active the same way in every engine.
  function inTransaction(db, stores, mode, body) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(stores, mode);
      transaction.oncomplete = () => resolve(transaction);
      transaction.onabort = () => reject(transaction.error || new DOMException("aborted", "AbortError"));
      try { body(transaction); } catch (error) { reject(error); try { transaction.abort(); } catch (ignored) {} }
    });
  }

  // Walks a cursor request to its end, collecting {key, primaryKey, value} of each step; `act(cursor, steps)`
  // may call continue(), advance() or continuePrimaryKey() itself, and returns true when it did.
  function walk(r, act) {
    return new Promise((resolve, reject) => {
      const steps = [];
      r.onerror = (event) => { event.preventDefault(); reject(r.error); };
      r.onsuccess = () => {
        const cursor = r.result;
        if (!cursor) { resolve(steps); return; }
        steps.push({ key: cursor.key, primaryKey: cursor.primaryKey, value: cursor.value });
        if (!(act && act(cursor, steps))) cursor.continue();
      };
    });
  }
  const keys = (steps) => steps.map((step) => step.key);
  const primaryKeys = (steps) => steps.map((step) => step.primaryKey);

  const deleteDatabase = (name) => within(new Promise((resolve, reject) => {
    const r = indexedDB.deleteDatabase(name);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error("deleteDatabase is blocked"));
  }), "deleteDatabase " + name);

  const NAME = "mercury-compat-idb";
  const ABORT_NAME = "mercury-compat-idb-abort";

  // The records of the message store. tags is the multiEntry field: record 4 has a string (one key), record 5 has
  // none (not in the index), record 6 repeats a tag (collapses to one key).
  const MESSAGES = [
    { id: 1, chatId: "alice", ts: 300, tags: ["a", "b"] },
    { id: 2, chatId: "bob", ts: 100, tags: ["b", "c"] },
    { id: 3, chatId: "alice", ts: 200, tags: ["c"] },
    { id: 4, chatId: "carol", ts: 100, tags: "b" },
    { id: 5, chatId: "bob", ts: 400 },
    { id: 6, chatId: "alice", ts: 300, tags: ["a", "a", "b"] },
  ];

  async function main() {
    let db;

    await step("delete the databases of an earlier run", async () => {
      await deleteDatabase(NAME);
      await deleteDatabase(ABORT_NAME);
    });

    // 1. The schema, in an upgrade transaction.
    await step("open version 1: a Dexie-like schema with a multiEntry index", async () => {
      let upgradeError = "none";
      db = await new Promise((resolve, reject) => {
        const open = indexedDB.open(NAME, 1);
        open.onupgradeneeded = () => {
          try {
            const upgrade = open.result;
            const message = upgrade.createObjectStore("message", { keyPath: "id" });
            message.createIndex("ts", "ts");
            message.createIndex("chatId", "chatId");
            message.createIndex("tags", "tags", { multiEntry: true });
            message.createIndex("chat_ts", ["chatId", "ts"]);
            // The second store reuses the index name "ts": unique per object store, not per database.
            const chat = upgrade.createObjectStore("chat", { keyPath: "id" });
            chat.createIndex("ts", "ts");
          } catch (error) {
            upgradeError = error.name + ": " + error.message;
          }
        };
        open.onsuccess = () => resolve(open.result);
        open.onerror = () => reject(open.error);
        open.onblocked = () => reject(new Error("open is blocked"));
      });
      check("no exception while creating the schema", upgradeError, "none");
      check("object stores", Array.from(db.objectStoreNames), ["chat", "message"]);
      const tx = db.transaction(["message", "chat"], "readonly");
      check("indexes of message", Array.from(tx.objectStore("message").indexNames), ["chatId", "chat_ts", "tags", "ts"]);
      check("indexes of chat", Array.from(tx.objectStore("chat").indexNames), ["ts"]);
      check("tags is multiEntry", tx.objectStore("message").index("tags").multiEntry, true);
      tx.abort();
    });
    if (!db) return;

    await step("put the records", async () => {
      await inTransaction(db, ["message", "chat"], "readwrite", (tx) => {
        for (const message of MESSAGES) tx.objectStore("message").put(message);
        tx.objectStore("chat").put({ id: "alice", ts: 5 });
      });
      const tx = await inTransaction(db, "message", "readonly", () => {});
      check("the transaction completed", tx.mode, "readonly");
    });

    // 2. The queries of a multiEntry index and of the other indexes.
    await step("index queries over the multiEntry index", async () => {
      const found = {};
      await inTransaction(db, "message", "readonly", (tx) => {
        const tags = tx.objectStore("message").index("tags");
        const get = (name, r) => { r.onsuccess = () => { found[name] = r.result; }; };
        get("allKeys", tags.getAllKeys());
        get("count", tags.count());
        get("countB", tags.count("b"));
        get("keysB", tags.getAllKeys("b"));
        get("keysAB", tags.getAllKeys(IDBKeyRange.bound("a", "b")));
        get("limit", tags.getAllKeys(null, 3));
        get("getC", tags.get("c"));
        get("getKeyC", tags.getKey("c"));
        get("getNone", tags.get("zzz"));
        get("valuesB", tags.getAll("b"));
      });
      // a: 1, 6   b: 1, 2, 4, 6   c: 2, 3   (the tag "a" of record 6 once, record 5 not at all)
      check("tags.getAllKeys()", found.allKeys, [1, 6, 1, 2, 4, 6, 2, 3]);
      check("tags.count()", found.count, 8);
      check("tags.count('b')", found.countB, 4);
      check("tags.getAllKeys('b')", found.keysB, [1, 2, 4, 6]);
      check("tags.getAllKeys(bound('a', 'b'))", found.keysAB, [1, 6, 1, 2, 4, 6]);
      check("tags.getAllKeys(null, 3)", found.limit, [1, 6, 1]);
      check("tags.get('c').id (the first record of the key)", found.getC && found.getC.id, 2);
      check("tags.getKey('c')", found.getKeyC, 2);
      check("tags.get('zzz') resolves with undefined", found.getNone, undefined);
      check("tags.getAll('b') ids", found.valuesB && found.valuesB.map((m) => m.id), [1, 2, 4, 6]);
      check("tags.getAll('b') values are whole records", found.valuesB && found.valuesB[0], MESSAGES[0]);
    });

    await step("index queries over the other indexes", async () => {
      const found = {};
      await inTransaction(db, "message", "readonly", (tx) => {
        const store = tx.objectStore("message");
        const get = (name, r) => { r.onsuccess = () => { found[name] = r.result; }; };
        get("tsKeys", store.index("ts").getAllKeys());
        get("tsRange", store.index("ts").getAllKeys(IDBKeyRange.bound(100, 200)));
        get("chatKeys", store.index("chatId").getAllKeys("alice"));
        get("chatTs", store.index("chat_ts").getAllKeys(["alice", 300]));
        get("chatTsRange", store.index("chat_ts").getAllKeys(IDBKeyRange.bound(["alice", 0], ["alice", 999])));
        get("chatTsCount", store.index("chat_ts").count());
      });
      check("ts.getAllKeys() (by ts, then by id)", found.tsKeys, [2, 4, 3, 1, 6, 5]);
      check("ts.getAllKeys(bound(100, 200))", found.tsRange, [2, 4, 3]);
      check("chatId.getAllKeys('alice')", found.chatKeys, [1, 3, 6]);
      check("chat_ts.getAllKeys(['alice', 300])", found.chatTs, [1, 6]);
      check("chat_ts.getAllKeys(bound(['alice', 0], ['alice', 999]))", found.chatTsRange, [3, 1, 6]);
      check("chat_ts.count()", found.chatTsCount, 6);
    });

    await step("get() and getKey() need a key (DataError)", async () => {
      const tx = db.transaction("message", "readonly");
      const index = tx.objectStore("message").index("ts");
      for (const method of ["get", "getKey"]) {
        for (const argument of [undefined, null]) {
          let name = "none";
          try { index[method](argument); } catch (error) { name = error.name; }
          check("index." + method + "(" + String(argument) + ") throws", name, "DataError");
        }
      }
      tx.abort();
    });

    // 3. Index cursors.
    await step("index cursors keep their position and their primary key", async () => {
      let next, prev, nextUnique, prevUnique, ranged, keyOnly, advanced, continued, byPrimary;
      let keyOnlyIsWithValue = null;
      await inTransaction(db, "message", "readonly", (tx) => {
        const ts = tx.objectStore("message").index("ts");
        walk(ts.openCursor()).then((steps) => { next = steps; });
        walk(ts.openCursor(null, "prev")).then((steps) => { prev = steps; });
        walk(ts.openCursor(null, "nextunique")).then((steps) => { nextUnique = steps; });
        walk(ts.openCursor(null, "prevunique")).then((steps) => { prevUnique = steps; });
        walk(ts.openCursor(IDBKeyRange.bound(100, 200))).then((steps) => { ranged = steps; });
        const keyCursor = ts.openKeyCursor();
        walk(keyCursor).then((steps) => { keyOnly = steps; });
        walk(ts.openCursor(), (cursor, steps) => {
          if (steps.length === 1) { cursor.advance(3); return true; }
          return false;
        }).then((steps) => { advanced = steps; });
        walk(ts.openCursor(), (cursor, steps) => {
          if (steps.length === 1) { cursor.continue(300); return true; }
          return false;
        }).then((steps) => { continued = steps; });
        walk(ts.openCursor(), (cursor, steps) => {
          if (steps.length === 1) { cursor.continuePrimaryKey(300, 6); return true; }
          return false;
        }).then((steps) => { byPrimary = steps; });
        keyCursor.addEventListener("success", () => {
          if (keyCursor.result && keyOnlyIsWithValue === null) keyOnlyIsWithValue = keyCursor.result instanceof IDBCursorWithValue;
        });
      });
      // The walks are promise chains; one more turn lets the last ones settle.
      await new Promise((resolve) => setTimeout(resolve, 0));
      check("openCursor(): keys", next && keys(next), [100, 100, 200, 300, 300, 400]);
      check("openCursor(): primary keys defined at every step", next && primaryKeys(next), [2, 4, 3, 1, 6, 5]);
      check("openCursor(): values are the records", next && next.map((s) => s.value.id), [2, 4, 3, 1, 6, 5]);
      check("openCursor(null, 'prev'): keys", prev && keys(prev), [400, 300, 300, 200, 100, 100]);
      check("openCursor(null, 'prev'): primary keys", prev && primaryKeys(prev), [5, 6, 1, 3, 4, 2]);
      check("openCursor(null, 'nextunique'): keys", nextUnique && keys(nextUnique), [100, 200, 300, 400]);
      check("openCursor(null, 'nextunique'): primary keys", nextUnique && primaryKeys(nextUnique), [2, 3, 1, 5]);
      check("openCursor(null, 'prevunique'): keys", prevUnique && keys(prevUnique), [400, 300, 200, 100]);
      check("openCursor(null, 'prevunique'): primary keys", prevUnique && primaryKeys(prevUnique), [5, 1, 3, 2]);
      check("openCursor(bound(100, 200)): primary keys", ranged && primaryKeys(ranged), [2, 4, 3]);
      check("openKeyCursor(): primary keys", keyOnly && primaryKeys(keyOnly), [2, 4, 3, 1, 6, 5]);
      check("openKeyCursor(): no value", keyOnly && keyOnly.every((s) => s.value === undefined), true);
      check("openKeyCursor() is not an IDBCursorWithValue", keyOnlyIsWithValue, false);
      check("advance(3) from the first record", advanced && primaryKeys(advanced).slice(0, 2), [2, 1]);
      check("continue(300) from the first record", continued && primaryKeys(continued).slice(0, 2), [2, 1]);
      check("continuePrimaryKey(300, 6) from the first record", byPrimary && primaryKeys(byPrimary).slice(0, 2), [2, 6]);
    });

    // 4. IDBRequest.source.
    await step("IDBRequest.source is the store, the index or the cursor", async () => {
      const found = {};
      let cursorRequest;
      await inTransaction(db, "message", "readwrite", (tx) => {
        const store = tx.objectStore("message");
        const index = store.index("ts");
        found.store = store;
        found.index = index;
        found.storeGet = store.get(1);
        found.indexGetAll = index.getAll();
        found.indexCount = index.count();
        found.storeCursor = store.openCursor();
        found.indexCursor = index.openCursor(200);
        found.indexCursor.onsuccess = () => {
          const cursor = found.indexCursor.result;
          if (cursor && !found.update) {
            found.cursor = cursor;
            found.update = cursor.update(Object.assign({}, cursor.value, { chatId: "zed" }));
          }
        };
      });
      check("store.get().source is the store", found.storeGet.source === found.store, true);
      check("index.getAll().source is the index", found.indexGetAll.source === found.index, true);
      check("index.count().source is the index", found.indexCount.source === found.index, true);
      check("store.openCursor().source is the store", found.storeCursor.source === found.store, true);
      check("index.openCursor().source is the index", found.indexCursor.source === found.index, true);
      check("cursor.update().source is the cursor", found.update && found.update.source === found.cursor, true);
    });

    // 5. IDBCursor.update() and delete() through an index cursor.
    await step("update() and delete() through an index cursor", async () => {
      await inTransaction(db, "message", "readwrite", (tx) => {
        const index = tx.objectStore("message").index("ts");
        const r = index.openCursor(400);
        r.onsuccess = () => { if (r.result) r.result.delete(); };
      });
      const found = {};
      await inTransaction(db, "message", "readonly", (tx) => {
        const store = tx.objectStore("message");
        const get = (name, r) => { r.onsuccess = () => { found[name] = r.result; }; };
        get("updated", store.get(3));
        get("count", store.count());
        get("tsKeys", store.index("ts").getAllKeys());
      });
      check("the record that update() wrote reads back", found.updated && found.updated.chatId, "zed");
      check("delete() removed the record at the cursor", found.count, 5);
      check("the index no longer has the deleted record", found.tsKeys, [2, 4, 3, 1, 6]);
    });

    // 6. commit().
    await step("IDBTransaction.commit()", async () => {
      let committedBy = "none";
      let secondCommit = "none";
      await new Promise((resolve, reject) => {
        const tx = db.transaction("chat", "readwrite");
        tx.oncomplete = () => { committedBy = "complete"; resolve(); };
        tx.onabort = () => reject(tx.error || new Error("aborted"));
        tx.objectStore("chat").put({ id: "bob", ts: 7 });
        tx.commit();
        try { tx.commit(); secondCommit = "no exception"; } catch (error) { secondCommit = error instanceof DOMException ? "DOMException" : String(error); }
      });
      check("oncomplete fires after commit()", committedBy, "complete");
      check("a second commit() throws a DOMException", secondCommit, "DOMException");
      const found = {};
      await inTransaction(db, "chat", "readonly", (tx) => {
        tx.objectStore("chat").get("bob").onsuccess = (event) => { found.bob = event.target.result; };
      });
      check("the committed record reads back", found.bob, { id: "bob", ts: 7 });
    });

    // 7. An aborted upgrade must not crash the page.
    await step("an upgrade aborted with abort()", async () => {
      const seen = await new Promise((resolve) => {
        const open = indexedDB.open(ABORT_NAME, 1);
        const outcome = { upgrade: false, error: "none", old: -1 };
        open.onupgradeneeded = () => {
          outcome.upgrade = true;
          outcome.old = 0;
          open.result.createObjectStore("a").createIndex("i", "x");
          open.transaction.abort();
        };
        open.onsuccess = () => { open.result.close(); resolve(Object.assign(outcome, { error: "succeeded" })); };
        open.onerror = () => resolve(Object.assign(outcome, { error: open.error ? open.error.name : "null" }));
      });
      check("upgradeneeded fired", seen.upgrade, true);
      check("the open request failed with an AbortError", seen.error, "AbortError");
    });
    await step("an upgrade aborted by an exception in onupgradeneeded", async () => {
      const seen = await new Promise((resolve) => {
        const open = indexedDB.open(ABORT_NAME, 1);
        const outcome = { old: -1, error: "none" };
        open.onupgradeneeded = (event) => {
          outcome.old = event.oldVersion;
          open.result.createObjectStore("a");
          throw new Error("the page's upgrade code failed");
        };
        open.onsuccess = () => { open.result.close(); resolve(Object.assign(outcome, { error: "succeeded" })); };
        open.onerror = (event) => { event.preventDefault(); resolve(Object.assign(outcome, { error: open.error ? open.error.name : "null" })); };
      });
      check("the aborted first upgrade left no database: oldVersion is 0 again", seen.old, 0);
      check("the open request failed with an AbortError", seen.error, "AbortError");
    });
    await step("a new open upgrades from version 0 and works", async () => {
      const store = await new Promise((resolve, reject) => {
        const open = indexedDB.open(ABORT_NAME, 1);
        open.onupgradeneeded = () => { open.result.createObjectStore("a", { keyPath: "id" }); };
        open.onsuccess = () => resolve(open.result);
        open.onerror = () => reject(open.error);
      });
      check("object stores after the new upgrade", Array.from(store.objectStoreNames), ["a"]);
      store.close();
    });

    // 8. databases().
    await step("IDBFactory.databases()", async () => {
      if (typeof indexedDB.databases !== "function") { inform("indexedDB.databases", "not a function"); return; }
      const list = await indexedDB.databases();
      const mine = list.find((entry) => entry.name === NAME);
      check("databases() lists the database at version 1", mine && mine.version, 1);
    });

    // Known gap (not counted): unique indexes are not enforced when a record is put.
    await step("INFO: a unique index and a duplicate key", async () => {
      db.close();
      await deleteDatabase(NAME);
      const unique = await new Promise((resolve, reject) => {
        const open = indexedDB.open(NAME, 1);
        open.onupgradeneeded = () => {
          open.result.createObjectStore("u", { keyPath: "id" }).createIndex("code", "code", { unique: true });
        };
        open.onsuccess = () => resolve(open.result);
        open.onerror = () => reject(open.error);
      });
      let second = "no error";
      await inTransaction(unique, "u", "readwrite", (tx) => {
        const store = tx.objectStore("u");
        store.put({ id: 1, code: "x" });
        const duplicate = store.put({ id: 2, code: "x" });
        duplicate.onerror = (event) => { second = duplicate.error ? duplicate.error.name : "error"; event.preventDefault(); };
      }).catch(() => {});
      inform("a second record with the same unique index key fails with (the specification says ConstraintError)", second);
      unique.close();
    });

    await step("clean up", async () => {
      await deleteDatabase(NAME);
      await deleteDatabase(ABORT_NAME);
    });
  }

  function finish() {
    if (finished) return;
    finished = true;
    const verdict = hung ? "HANG" : passes + " PASS, " + failures + " FAIL";
    summary.textContent = passes + " PASS, " + failures + " FAIL" + (hung ? " (a step hung)" : "");
    summary.className = failures === 0 && !hung ? "pass" : "fail";
    document.title = "compat-indexeddb: " + verdict;
  }

  // The page itself must not hang either: whatever happens, a verdict is in the title after a minute.
  setTimeout(() => { hung = true; line("fail", "the page did not finish in 60 seconds"); finish(); }, 60000);
  main().catch((error) => line("fail", "the script failed: " + error)).finally(finish);
</script>
</body>
</html>
