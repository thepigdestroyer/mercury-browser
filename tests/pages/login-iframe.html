<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login form in a frame test page</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { padding: 24px; font: 22px/1.5 sans-serif; color: #000000; }
  h1 { margin: 0 0 12px; font-size: 32px; }
  iframe { width: 720px; height: 360px; border: 2px solid #888888; }
</style>
</head>
<body>
  <h1>Login form in a frame on another origin</h1>
  <p>The top page has no password field; the frame (on localhost, another origin) has one with
  focus. The browser must fill nothing.</p>
<script>
  const frame = document.createElement("iframe");
  frame.src = location.protocol + "//localhost:" + location.port + "/pages/login-form.html";
  document.body.appendChild(frame);
</script>
</body>
</html>
