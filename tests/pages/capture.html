<!doctype html>
<meta charset="utf-8">
<title>CAPTURE pending</title>
<!--
  Camera and microphone test page (media-capture lane). Run only in fake-device mode:
  scripts/macos/test-capture.sh. Writes its verdict to the document title as
  "CAPTURE key=value; key=value; …", which the window-title log carries out of the browser.
  The audio track is never attached to any output.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; }
  video, canvas { width: 160px; height: 120px; border: 1px solid #888; }
  pre { white-space: pre-wrap; }
</style>
<h1>Camera and microphone</h1>
<p>Fake devices only. The verdict is in the title.</p>
<video id="video" muted playsinline></video>
<canvas id="canvas" width="160" height="120"></canvas>
<pre id="out">waiting</pre>
<script>
  const results = [];
  const out = document.getElementById("out");
  function note(key, value) {
    results.push(`${key}=${value}`);
    out.textContent = results.join("\n");
    document.title = "CAPTURE " + results.join("; ");
  }
  function describe(devices) {
    return devices
      .map((device) => `${device.kind}:${device.label || "-"}:${device.deviceId ? "id" : "-"}`)
      .join(",") || "none";
  }
  function sample(video, canvas) {
    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
    let sum = 0;
    const seen = new Set();
    for (let i = 0; i < data.length; i += 4 * 97) {
      sum += data[i] + data[i + 1] + data[i + 2];
      seen.add(data[i] * 65536 + data[i + 1] * 256 + data[i + 2]);
    }
    return { sum, colours: seen.size };
  }
  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function run() {
    note("mediaDevices", typeof navigator.mediaDevices);
    note("RTCPeerConnection", typeof window.RTCPeerConnection);
    note("RTCIceCandidate", typeof window.RTCIceCandidate);
    if (!navigator.mediaDevices) {
      note("verdict", "no-mediaDevices");
      return;
    }
    note("before", describe(await navigator.mediaDevices.enumerateDevices()));
    note("permission", "asked");
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (error) {
      note("getUserMedia", error.name);
      note("verdict", error.name === "NotAllowedError" ? "denied" : "error");
      return;
    }
    const [videoTrack] = stream.getVideoTracks();
    const [audioTrack] = stream.getAudioTracks();
    note("getUserMedia", "ok");
    note("tracks", `${videoTrack ? videoTrack.kind : "-"},${audioTrack ? audioTrack.kind : "-"}`);
    note("readyState", `${videoTrack.readyState},${audioTrack.readyState}`);
    note("after", describe(await navigator.mediaDevices.enumerateDevices()));

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    video.srcObject = new MediaStream([videoTrack]);
    try {
      await video.play();
    } catch (error) {
      note("play", error.name);
    }
    for (let i = 0; i < 50 && !(video.videoWidth > 0); i++) await delay(100);
    note("videoSize", `${video.videoWidth}x${video.videoHeight}`);
    const first = sample(video, canvas);
    await delay(500);
    const second = sample(video, canvas);
    note("frames", `colours=${first.colours},${second.colours} moving=${first.sum !== second.sum}`);

    const framesOk = first.colours > 1 && first.sum !== second.sum;
    const params = new URLSearchParams(location.search);
    // ?then=<url>: leave the page with the devices still open (the engine must release them).
    if (params.has("then")) {
      note("verdict", framesOk ? "PASS-LEAVING" : "FAIL");
      await delay(300);
      location.href = params.get("then");
      return;
    }
    videoTrack.stop();
    audioTrack.stop();
    note("stopped", `${videoTrack.readyState},${audioTrack.readyState}`);
    note("verdict", framesOk ? "PASS" : "FAIL");
  }
  run().catch((error) => note("verdict", "exception " + error));
</script>
