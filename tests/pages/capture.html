<!doctype html>
<meta charset="utf-8">
<title>CAPTURE pending</title>
<!--
  Camera and microphone test page (media-capture lane). Run only in fake-device mode:
  scripts/macos/test-capture.sh. Writes its verdict to the document title as
  "CAPTURE key=value; key=value; …", which the window-title log carries out of the browser.
  The audio track plays in a muted <audio> (so that it has a pipeline whose release shows in
  GStreamer's log); the fake-device copy has no audio output plugin anyway.
  Parameters:
    ?none=1          getUserMedia({audio: false, video: false}), which must throw a TypeError.
    ?then=<url>      leave the page with the devices still open.
    ?then=reload     reload the page with the devices still open; the reloaded page asks for
                     nothing and says "verdict=reloaded".
    ?clone=1         stop the camera track while a clone of it plays on, then stop the clone.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; }
  video, canvas { width: 160px; height: 120px; border: 1px solid #888; }
  pre { white-space: pre-wrap; }
</style>
<h1>Camera and microphone</h1>
<p>Fake devices only. The verdict is in the title.</p>
<video id="video" muted playsinline></video>
<audio id="audio" muted></audio>
<canvas id="canvas" width="160" height="120"></canvas>
<pre id="out">waiting</pre>
<script>
  const results = [];
  const out = document.getElementById("out");
  function note(key, value) {
    results.push(`${key}=${value}`);
    out.textContent = results.join("\n");
    document.title = "CAPTURE " + results.join("; ");
  }
  function describe(devices) {
    return devices
      .map((device) => `${device.kind}:${device.label || "-"}:${device.deviceId ? "id" : "-"}`)
      .join(",") || "none";
  }
  // A fingerprint of every pixel of the video's current frame. (Summing every 97th pixel, as this
  // page once did, gave the same number for frames with the ball in different places, so a
  // camera that moved could look frozen.)
  function sample(video, canvas) {
    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
    let hash = 0x811c9dc5;
    const seen = new Set();
    for (let i = 0; i < data.length; i += 4) {
      const colour = data[i] * 65536 + data[i + 1] * 256 + data[i + 2];
      seen.add(colour);
      hash = Math.imul(hash ^ colour, 0x01000193);
    }
    return { hash: hash >>> 0, colours: seen.size };
  }
  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  // Whether the video shows frames that change: three different frames within `limit` ms. The
  // wait is for that condition (a runner that is busy for a while only delays it), and a
  // frozen picture, or one that went blank when its source was released, never reaches it.
  async function watchFrames(video, canvas, limit = 5000) {
    const first = sample(video, canvas);
    const seen = new Set([first.hash]);
    const start = performance.now();
    while (seen.size < 3 && performance.now() - start < limit) {
      await delay(50);
      seen.add(sample(video, canvas).hash);
    }
    return { colours: first.colours, distinct: seen.size, moving: seen.size >= 3 };
  }

  async function run() {
    note("mediaDevices", typeof navigator.mediaDevices);
    note("RTCPeerConnection", typeof window.RTCPeerConnection);
    note("RTCIceCandidate", typeof window.RTCIceCandidate);
    if (!navigator.mediaDevices) {
      note("verdict", "no-mediaDevices");
      return;
    }
    const params = new URLSearchParams(location.search);
    if (params.get("then") === "reload" && sessionStorage.getItem("capture-reloaded")) {
      sessionStorage.removeItem("capture-reloaded");
      note("verdict", "reloaded");
      return;
    }
    if (params.has("none")) {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: false, video: false });
        note("none", "ok");
      } catch (error) {
        note("none", error.name);
      }
      note("verdict", "done");
      return;
    }
    note("before", describe(await navigator.mediaDevices.enumerateDevices()));
    note("permission", "asked");
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (error) {
      note("getUserMedia", error.name);
      note("verdict", error.name === "NotAllowedError" ? "denied" : "error");
      return;
    }
    const [videoTrack] = stream.getVideoTracks();
    const [audioTrack] = stream.getAudioTracks();
    note("getUserMedia", "ok");
    note("tracks", `${videoTrack ? videoTrack.kind : "-"},${audioTrack ? audioTrack.kind : "-"}`);
    note("readyState", `${videoTrack.readyState},${audioTrack.readyState}`);
    note("after", describe(await navigator.mediaDevices.enumerateDevices()));

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    video.srcObject = new MediaStream([videoTrack]);
    try {
      await video.play();
    } catch (error) {
      note("play", error.name);
    }
    const audio = document.getElementById("audio");
    audio.srcObject = new MediaStream([audioTrack]);
    audio.play().catch((error) => note("audioPlay", error.name));
    for (let i = 0; i < 50 && !(video.videoWidth > 0); i++) await delay(100);
    note("videoSize", `${video.videoWidth}x${video.videoHeight}`);
    const frames = await watchFrames(video, canvas);
    note("frames", `colours=${frames.colours} distinct=${frames.distinct} moving=${frames.moving}`);

    const framesOk = frames.colours > 1 && frames.moving;
    // ?then=<url>: leave the page with the devices still open (the engine must release them).
    if (params.has("then")) {
      note("verdict", framesOk ? "PASS-LEAVING" : "FAIL");
      await delay(300);
      if (params.get("then") === "reload") {
        sessionStorage.setItem("capture-reloaded", "1");
        location.reload();
      } else {
        location.href = params.get("then");
      }
      return;
    }
    // ?clone=1: the camera stays open while a clone of its track is live.
    if (params.has("clone")) {
      const clone = videoTrack.clone();
      videoTrack.stop();
      audioTrack.stop();
      await delay(1500);
      const afterStop = await watchFrames(video, canvas);
      note("clone", `${videoTrack.readyState},${clone.readyState} moving=${afterStop.moving}`);
      // test-capture.sh checks that the camera source is still there when this title is shown.
      await delay(1500);
      clone.stop();
      note("cloneStopped", clone.readyState);
      note("verdict", framesOk ? "PASS" : "FAIL");
      return;
    }
    videoTrack.stop();
    audioTrack.stop();
    note("stopped", `${videoTrack.readyState},${audioTrack.readyState}`);
    note("verdict", framesOk ? "PASS" : "FAIL");
  }
  run().catch((error) => note("verdict", "exception " + error));
</script>
