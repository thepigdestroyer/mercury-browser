<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSE seek</title>
<style>
  /* Explicit colours: in dark mode Servo 0.8 gives unstyled text a light colour on a white canvas. */
  html { background: #ffffff; color: #000000; }
  body { font: 16px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 12px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { font-size: 13px; color: #444444; margin: 0 0 8px; }
  #sum { font: bold 18px/1.4 Menlo, monospace; margin: 4px 0 8px; }
  .line { font: 14px/1.45 Menlo, monospace; margin: 0; word-break: break-all; }
  .pass { color: #006400; }
  .fail { color: #b00000; font-weight: bold; }
  .info { color: #1a4f8b; }
  video { background: #202020; display: block; margin: 8px 0; }
</style>
</head>
<body>
<h1>MSE seek</h1>
<p class="note">Seeks inside the buffer, past the end, and into an unbuffered range that is filled later.</p>
<div id="sum">running</div>
<video id="v" width="320" height="180" muted playsinline></video>
<div id="out"></div>
<!--
  Mercury test page for Media Source Extensions (lane med-1, MSE by Plan B). NOT RUN yet: the screen was
  locked when it was written. It needs a browser started with MERCURY_DEV_MSE=1 (the preference
  dom_media_source_enabled is off otherwise) and the fixtures of crates/mercury-mse-testkit/fixtures served
  by scripts/serve-tests.sh under /mse-fixtures/ (override with ?fixtures=<base url>). Every check prints one
  line that starts with PASS or FAIL (INFO lines only print a value); the result is also in document.title,
  which ends with "(done)" when the page has finished. See docs/developer-guide/media-source.md.
  The fixtures are 8 s at 25 fps, red for the first 4 s and blue for the last 4 s, a key frame every 2 s.
-->
<script>
"use strict";
const params = new URLSearchParams(location.search);
const BASE = params.get("fixtures") || "/mse-fixtures/";
const TITLE = "MSE seek";
const out = document.getElementById("out");
const video = document.getElementById("v");
let passed = 0, failed = 0;
function line(cls, text) { const d = document.createElement("div"); d.className = "line " + cls; d.textContent = text; out.appendChild(d); }
function check(name, ok, detail) {
  if (ok) { passed++; line("pass", "PASS " + name); } else { failed++; line("fail", "FAIL " + name + (detail !== undefined ? ": " + detail : "")); }
  return ok;
}
function info(text) { line("info", "INFO " + text); }
function finish(error) {
  if (error) { failed++; line("fail", "FAIL the page stopped: " + (error && error.stack || error)); }
  const text = passed + " PASS, " + failed + " FAIL";
  document.getElementById("sum").textContent = text;
  document.title = TITLE + ": " + text + " (done)";
}
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
function once(target, name, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { target.removeEventListener(name, handler); reject(new Error("timeout waiting for " + name)); }, ms || 10000);
    const handler = event => { clearTimeout(timer); resolve(event); };
    target.addEventListener(name, handler, { once: true });
  });
}
async function until(predicate, ms, what) {
  const end = performance.now() + (ms || 10000);
  while (!predicate()) { if (performance.now() > end) throw new Error("timeout waiting for " + what); await sleep(50); }
}
async function bytes(path) {
  const response = await fetch(BASE + path);
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return new Uint8Array(await response.arrayBuffer());
}
// Fragmented MP4: the initialization segment is everything before the first styp (or moof), each media
// segment starts at a styp (or at a moof that no styp precedes).
function splitMp4(b) {
  const view = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let init = null, current = -1, previous = ""; const segments = [];
  for (let p = 0; p + 8 <= b.length;) {
    let size = view.getUint32(p);
    const type = String.fromCharCode(b[p + 4], b[p + 5], b[p + 6], b[p + 7]);
    if (size === 1) size = Number(view.getBigUint64(p + 8)); else if (size === 0) size = b.length - p;
    if (size < 8) break;
    if (type === "styp" || (type === "moof" && previous !== "styp")) {
      if (init === null) init = b.subarray(0, p); else segments.push(b.subarray(current, p));
      current = p;
    }
    previous = type; p += size;
  }
  if (current >= 0) segments.push(b.subarray(current));
  return { init, segments };
}
async function fixture(path) { return splitMp4(await bytes(path)); }
const H264_LOW = 'video/mp4; codecs="avc1.42C00C"', H264_HIGH = 'video/mp4; codecs="avc1.42C01E"', AAC = 'audio/mp4; codecs="mp4a.40.2"';
async function openSource() {
  const mediaSource = new MediaSource();
  const url = URL.createObjectURL(mediaSource);
  video.src = url;
  await once(mediaSource, "sourceopen");
  return { mediaSource, url };
}
async function append(sourceBuffer, data) {
  sourceBuffer.appendBuffer(data);
  await once(sourceBuffer, "updateend");
}
function ranges(timeRanges) { const r = []; for (let i = 0; i < timeRanges.length; i++) r.push([+timeRanges.start(i).toFixed(3), +timeRanges.end(i).toFixed(3)]); return JSON.stringify(r); }
function meanColour() {
  try {
    const canvas = document.createElement("canvas"); canvas.width = 16; canvas.height = 9;
    const context = canvas.getContext("2d"); context.drawImage(video, 0, 0, 16, 9);
    const data = context.getImageData(0, 0, 16, 9).data; let r = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) { r += data[i]; b += data[i + 2]; }
    return { r: r / 144, b: b / 144 };
  } catch (error) { return null; }
}
const isRed = c => c && c.r > c.b + 60, isBlue = c => c && c.b > c.r + 60;
if (typeof MediaSource === "undefined") {
  check("MediaSource exists (start the browser with MERCURY_DEV_MSE=1)", false);
  finish();
} else {
  (async () => {
    async function seekTo(time, ms) {
      const seeked = once(video, "seeked", ms || 4000);
      const t0 = performance.now();
      video.currentTime = time;
      check("seeking is true right after the assignment (" + time + ")", video.seeking === true);
      await seeked;
      info("seek to " + time + " took " + Math.round(performance.now() - t0) + " ms (first frame within 500 ms is the target)");
      return video.currentTime;
    }
    {
      const { mediaSource } = await openSource();
      const sb = mediaSource.addSourceBuffer(H264_LOW);
      const f = await fixture("fmp4/video-h264-low.mp4");
      await append(sb, f.init);
      for (const s of f.segments) await append(sb, s);
      mediaSource.endOfStream();
      await until(() => video.readyState >= 4, 5000, "HAVE_ENOUGH_DATA");
      video.play().catch(error => info("play() rejected: " + error));
      await until(() => video.currentTime > 0.5, 8000, "currentTime > 0.5");
      let t = await seekTo(5.0);
      check("seek to 5.0 lands near 5.0", Math.abs(t - 5.0) < 0.5, t);
      await sleep(400);
      let c = meanColour(); info("colour at 5 s: " + JSON.stringify(c));
      check("5.0 s is blue", c === null || isBlue(c));
      t = await seekTo(0.5);
      check("seek back to 0.5 lands near 0.5", Math.abs(t - 0.5) < 0.5, t);
      await sleep(400);
      c = meanColour(); info("colour at 0.5 s: " + JSON.stringify(c));
      check("0.5 s is red", c === null || isRed(c));
      t = await seekTo(7.9);
      check("seek to 7.9 lands near 7.9", Math.abs(t - 7.9) < 0.5, t);
      video.currentTime = 100;
      await sleep(500);
      check("a seek past the end is clamped to the duration", video.currentTime <= 8.001, video.currentTime);
      check("the seekable range is [0, 8)", ranges(video.seekable) === "[[0,8]]", ranges(video.seekable));
    }
    // A seek into a range that is not buffered holds until data arrives there.
    {
      const { mediaSource } = await openSource();
      const sb = mediaSource.addSourceBuffer(H264_LOW);
      const f = await fixture("fmp4/video-h264-low.mp4");
      await append(sb, f.init);
      await append(sb, f.segments[0]); await append(sb, f.segments[1]);
      await until(() => video.readyState >= 2, 5000, "HAVE_CURRENT_DATA");
      video.currentTime = 6;
      await sleep(1000);
      check("seeking stays true while 6 s is not buffered", video.seeking === true, video.seeking);
      check("readyState is HAVE_METADATA while seeking to an unbuffered position", video.readyState === 1, video.readyState);
      const seeked = once(video, "seeked", 4000);
      const t0 = performance.now();
      await append(sb, f.segments[2]); await append(sb, f.segments[3]);
      await seeked;
      info("seeked " + Math.round(performance.now() - t0) + " ms after the data arrived (1000 ms expected at most)");
      check("seeked fires once the data is appended", video.seeking === false && video.readyState >= 2, video.readyState);
      const c = meanColour(); info("colour after the late append: " + JSON.stringify(c));
      check("6 s is blue", c === null || isBlue(c));
    }
  })().then(() => finish(), error => finish(error));
}
</script>
</body>
</html>
