<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frame</title>
<style>body { font: 18px system-ui, sans-serif; margin: 10px; background: #efe; }</style>
</head>
<body>
<!-- openurl lane: navigates itself to the URL its parent posts (see openurl-file.html). -->
<p id="status">web frame, waiting for a target</p>
<script>
  addEventListener("message", (event) => {
    document.getElementById("status").textContent = "web frame: location = " + event.data;
    location = event.data;
  });
</script>
</body>
</html>
