<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blocked frame</title>
<style>
  body { font: 20px system-ui, sans-serif; margin: 30px; background: #eef; }
  iframe { width: 420px; height: 60px; border: 2px solid #446; background: #fff; }
  #status { font-weight: bold; }
</style>
</head>
<body>
<!--
  A page whose ad-network resources the content blocker refuses. Its `load` event must still
  fire: a blocked frame used to leave the page loading for ever (a screenshot run exits 3).
  ?only=frame|image|script loads one kind only (default: all three).
-->
<p id="status">waiting for the page's load event…</p>
<p id="kinds"></p>
<div id="slot"></div>
<script>
  const only = new URLSearchParams(location.search).get("only");
  const slot = document.getElementById("slot");
  const kinds = [];
  if (!only || only === "frame") {
    const frame = document.createElement("iframe");
    frame.src = "https://googleads.g.doubleclick.net/pagead/id";
    slot.append(frame);
    kinds.push("frame");
  }
  if (!only || only === "image") {
    const image = document.createElement("img");
    image.src = "https://googleads.g.doubleclick.net/pagead/viewthroughconversion/1/?x=1";
    image.width = 20;
    image.height = 20;
    slot.append(image);
    kinds.push("image");
  }
  if (!only || only === "script") {
    const script = document.createElement("script");
    script.src = "https://www.google-analytics.com/analytics.js";
    slot.append(script);
    kinds.push("script");
  }
  document.getElementById("kinds").textContent = "blocked kinds on this page: " + kinds.join(", ");
  addEventListener("load", () => {
    document.getElementById("status").textContent = "load event fired";
  });
</script>
</body>
</html>
