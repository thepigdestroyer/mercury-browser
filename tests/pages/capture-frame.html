<!doctype html>
<meta charset="utf-8">
<title>CAPTURE pending</title>
<!--
  Camera and microphone from a frame (media-capture lane). ?frame=cross loads the frame from
  "localhost" (another origin than this page's 127.0.0.1); ?frame=same from this page's own origin.
  The frame reports getUserMedia's result and the camera permission state; the verdict is in the
  title, as in capture.html.
  ?frame=remove: a frame of this page's own origin keeps its camera track playing, and this page
  then removes the frame (the engine must release the camera).
  ?frame=cross&worker=1: the cross-origin frame's worker asks for the camera instead.
-->
<style>body { font: 14px system-ui, sans-serif; margin: 16px; } iframe { width: 420px; height: 140px; }</style>
<h1>Camera and microphone in a frame</h1>
<pre id="out">waiting</pre>
<script>
  const params = new URLSearchParams(location.search);
  const which = params.get("frame") || "cross";
  const host = which === "cross" ? "localhost" : "127.0.0.1";
  const inner = new URLSearchParams();
  if (which === "remove") inner.set("keep", "1");
  if (params.has("worker")) inner.set("worker", "1");
  const frame = document.createElement("iframe");
  frame.src = `http://${host}:${location.port}/pages/capture-frame-inner.html?${inner}`;
  document.body.appendChild(frame);
  function show(text) {
    document.getElementById("out").textContent = text;
    document.title = "CAPTURE " + text;
  }
  window.addEventListener("message", (event) => {
    const text = `frame=${which}; ${event.data}`;
    show(text);
    if (which === "remove" && event.data.includes("getUserMedia=ok")) {
      setTimeout(() => {
        frame.remove();
        show(`${text}; removed=yes`);
      }, 1500);
    }
  });
</script>
