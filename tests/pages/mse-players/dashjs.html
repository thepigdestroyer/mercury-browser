<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSE players: dash.js</title>
<!-- SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0 -->
<!-- SPDX-FileCopyrightText: 2026 Mrinal Joshi and the Mercury Browser contributors -->
<style>
  /* Explicit colours: in dark mode Servo 0.8 gives unstyled text a light colour on a white canvas. */
  html { background: #ffffff; color: #000000; }
  body { font: 16px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 12px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { font-size: 13px; color: #444444; margin: 0 0 8px; }
  #sum { font: bold 18px/1.4 Menlo, monospace; margin: 4px 0 8px; }
  .line { font: 14px/1.45 Menlo, monospace; margin: 0; word-break: break-all; }
  .pass { color: #006400; }
  .fail { color: #b00000; font-weight: bold; }
  .info { color: #1a4f8b; }
  video { background: #202020; display: block; margin: 8px 0; }
</style>
</head>
<body>
<h1>MSE players: dash.js</h1>
<p class="note">dash.js plays the generated 8 s DASH stream (/mse-dash/h264/manifest.mpd: two H.264 renditions and AAC): start, one seek, one forced quality switch, play to the end, getVideoPlaybackQuality().</p>
<div id="sum">running</div>
<video id="v" width="320" height="180" muted playsinline></video>
<div id="out"></div>
<!--
  Mercury test page for Media Source Extensions (lane med-1b, D11). NOT RUN yet. It needs a browser started
  with MERCURY_DEV_MSE=1, the player fetched by scripts/dev/fetch-mse-tools.sh and both served by
  scripts/serve-tests.sh (/mse-players/dash.all.min.js, /mse-dash/). Lines start with PASS, FAIL or INFO; the
  title ends with "(done)". Run all of it with scripts/dev/mse-window-run.sh players.
-->
<script src="common.js"></script>
<script>
"use strict";
kit.run("MSE players: dash.js", async () => {
  await kit.loadScript("/mse-players/dash.all.min.js");
  kit.check("dash.js is loaded", typeof dashjs === "object" && typeof dashjs.MediaPlayer === "function");
  const video = document.getElementById("v");
  const errors = [];
  const player = dashjs.MediaPlayer().create();
  kit.info("dash.js " + (player.getVersion ? player.getVersion() : "?"));
  player.on(dashjs.MediaPlayer.events.ERROR, event => {
    const text = JSON.stringify(event.error || event).slice(0, 300);
    errors.push(text);
    kit.info("player error event: " + text);
  });
  // Keep the first rendition until the page switches: an ABR decision in the middle of the page's own checks would blur them.
  player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false, audio: false } } } });
  player.initialize(video, "/mse-dash/h264/manifest.mpd", true);
  await kit.standardRun({
    video, errors,
    async switchTo(width) {
      const reps = player.getRepresentationsByType ? player.getRepresentationsByType("video") : player.getBitrateInfoListFor("video");
      kit.info("video renditions: " + JSON.stringify(reps.map(r => r.width || r.height)));
      const index = reps.findIndex(r => r.width === width);
      if (index < 0) throw new Error("no rendition " + width + " wide in the manifest");
      if (player.setRepresentationForTypeByIndex) player.setRepresentationForTypeByIndex("video", index, true);
      else player.setQualityFor("video", index, true);
    },
  });
  player.destroy();
}, 48000);
</script>
</body>
</html>
