  <title id="t">Mercury Browser</title>
  <desc id="d">The Mercury Browser icon, the M sigil crossing the Sun like Mercury in transit, beside the words Mercury Browser: a Rust browser built on Servo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0819"/>
      <stop offset="1" stop-color="#231941"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <g fill="none" stroke="#FFB547" stroke-width="1.5">
      <ellipse cx="1150" cy="200" rx="360" ry="100" transform="rotate(-14 1150 200)" opacity="0.12"/>
      <ellipse cx="1150" cy="200" rx="250" ry="68" transform="rotate(-14 1150 200)" opacity="0.08"/>
    </g>
    <circle cx="200" cy="200" r="220" fill="url(#glow)"/>
  </g>
  <g transform="translate(40 40) scale(0.3125)">
  <defs>
    <linearGradient id="i-plate" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
