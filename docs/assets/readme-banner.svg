  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#i-plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#i-sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
