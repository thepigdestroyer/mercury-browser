      <stop offset="1" stop-color="#0C0819"/>
    </linearGradient>
    <linearGradient id="i-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="600">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="i-halo" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="300">
      <stop offset="0.7" stop-color="#FF9A3C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i-sun" gradientUnits="userSpaceOnUse" cx="482" cy="462" r="290">
