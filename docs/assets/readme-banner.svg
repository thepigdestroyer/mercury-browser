  <text x="400" y="196" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Mercury Browser</text>
  <text x="404" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#BDB3D6">A Rust browser built on Servo</text>
  <text x="404" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#FFB547" opacity="0.9">macOS · Servo 0.8 · Slint · Rust</text>
