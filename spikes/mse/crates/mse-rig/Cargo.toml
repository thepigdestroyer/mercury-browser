[package]
name = "mse-rig"
description = "The GstMSE test rig: private GStreamer set-up, a thin backend over gstreamer-mse (the sketch for MED-1), pipelines with counting sinks, an event log and the report types."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glib = { workspace = true }
libc = { workspace = true }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-mse = { workspace = true }
gstreamer-play = { workspace = true }
gstreamer-video = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mse-segments = { path = "../mse-segments" }

# The harness protocol test starts copies of its own executable as scenario children (`--child <ID>`),
# so it needs its own `main` instead of libtest's.
[[test]]
name = "harness_protocol"
harness = false
