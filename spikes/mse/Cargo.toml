#
# The GstMSE spike (lane sp-mse, R14 SP-mse, R14a EA1). A workspace of its own, on purpose: the root
# workspace lists its members one by one and never includes this directory, so `make check`, `make lint`,
# `make test` (all `--workspace --all-features`), `cargo deny` and the Linux CI never see it. It is not
# wired into the app. Build it only through `spikes/mse/run.sh` (target directory `<worktree>/target`).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
glib = "0.22"
# `v1_28`: the framework is GStreamer 1.28.9 (scripts/macos/gstreamer.sh). Servo 0.8 uses gstreamer-rs 0.25.4.
gstreamer = { version = "0.25", features = ["v1_28"] }
gstreamer-app = { version = "0.25", features = ["v1_28"] }
gstreamer-play = { version = "0.25", features = ["v1_28"] }
gstreamer-video = { version = "0.25", features = ["v1_28"] }
# R14a: 0.25.0 is the release that matches gstreamer-rs 0.25 (0.24.5 would add a second, incompatible gstreamer-rs).
gstreamer-mse = { version = "0.25", features = ["v1_28"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
