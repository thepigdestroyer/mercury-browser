# SPDX-License-Identifier: MPL-2.0
[package]
name = "mercury-ui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Names the elements in the generated code, so tests can find them through Slint's testing
# backend. Only for tests: it also turns off one of Slint's optimisations for the whole UI.
test-support = []

[dependencies]
slint.workspace = true

# Only for rendering without a display: `examples/render_settings.rs` (the settings window),
# `examples/render_controls.rs` (the page-control popups), `examples/render_tabs.rs` (the
# pop-up indicator), `examples/render_bookmarks.rs` (the bookmarks bar, star popover and
# manager), `examples/render_import.rs` (the import window), `tests/page_request_render.rs`
# (the dialog components, which also uses talaria-core's message cleaning), `tests/render_menus.rs`
# (the browser menu and the About window), the history lane's `examples/render_history.rs`
# and `tests/suggestion_click.rs` (which also need system fonts), `tests/session_bar.rs`
# (the session bar), `tests/render_tab_audio.rs` (the tab's sound indicator),
# `tests/find_bar_render.rs` (the find bar), `tests/downloads_render.rs` (the downloads
# components) and `examples/render_passwords.rs` (the Passwords section and the fill menu).
# Dev-only, so the application's Slint features are unchanged.
# a11y-base: `i-slint-backend-testing` is for the `tests/a11y_*.rs` tests, which find elements by
# their accessible label and read their roles; they need the `test-support` feature.
[dev-dependencies]
i-slint-backend-testing.workspace = true
image.workspace = true
slint = { workspace = true, features = ["renderer-software", "software-renderer-systemfonts"] }
talaria-core = { path = "../talaria-core" }

# a11y-base: `examples/a11y_real_adapter.rs` asks its own process for the accessibility tree that
# AccessKit's macOS adapter builds, the way VoiceOver does. Dev-only; both are already in the build.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString"] }

[build-dependencies]
slint-build.workspace = true
