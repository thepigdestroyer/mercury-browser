[package]
name = "mercury-ui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

# history lane: `examples/render_history.rs` draws the main window headless, through Slint's
# software renderer, and saves PNGs of the history lane's UI.
[dev-dependencies]
image.workspace = true
slint = { workspace = true, features = ["renderer-software", "software-renderer-systemfonts"] }
