[package]
name = "mercury-ui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

# Headless rendering of the find bar in `tests/find_bar_render.rs`. Dev-only, so the application's
# Slint features are unchanged.
[dev-dependencies]
image.workspace = true
slint = { workspace = true, features = ["renderer-software"] }
