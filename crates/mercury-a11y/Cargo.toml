[package]
name = "mercury-a11y"
description = "Mercury Browser's page accessibility logic without the engine: roles, names, states, relations, actions, tree snapshots and the per-tab graft routing."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
a11y-dom.workspace = true
accesskit.workspace = true
# The tree consumer AccessKit's own adapters use: `snapshot::dump` reads one, and every tree test uses it as the oracle (it
# panics where AccessKit would). Already in the lock through Slint's accesskit_winit.
accesskit_consumer.workspace = true
accname.workspace = true
