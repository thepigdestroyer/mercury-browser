# SPDX-License-Identifier: MPL-2.0
[package]
name = "talaria-servo"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# a11y-1: the page tree reaches the window (`src/accessibility.rs`).
accesskit.workspace = true
adblock.workspace = true
content-security-policy.workspace = true
dpi.workspace = true
euclid.workspace = true
# openurl
http.workspace = true
log.workspace = true
rustls.workspace = true
# Checks the HTTP disk cache Servo opens (the same rusqlite Servo uses).
rusqlite.workspace = true
serde_json.workspace = true
servo.workspace = true
talaria-core = { path = "../talaria-core" }
# a11y-1: which tab's page tree reaches the window (`src/accessibility.rs`).
mercury-a11y = { path = "../mercury-a11y" }
# site security: Mercury's error pages, and Servo's other resources (patched, see Cargo.toml).
getrandom.workspace = true
mercury-proxy = { path = "../mercury-proxy" }
mercury-site-security = { path = "../mercury-site-security" }
# sh-pages: the view-source handler (`view_source.rs`) fetches, highlights and renders with this crate.
futures-util.workspace = true
mercury-view-source = { path = "../mercury-view-source" }
# sh-pages: the engine's own bad-port list (`should_request_be_blocked_due_to_a_bad_port`), HSTS
# list, cookie jar type and locale, reused by the re-fetch so that it follows the same rules.
servo-net = "=0.8.0"
servo-net-traits = "=0.8.0"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
servo-default-resources = "=0.8.0"
url.workspace = true

# The content process's parent watchdog (`content_process.rs`) is Unix-only.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Servo defaults to a no-op media backend. Linux and macOS builds opt into the
# production GStreamer backend so HTML audio/video, Web Audio, and WebRTC have a
# real media pipeline. On macOS the official GStreamer framework is unpacked by
# scripts/macos/gstreamer.sh and its libraries are copied next to the executable
# by scripts/macos/collect-gstreamer.sh. Other platforms keep the no-op backend
# until their release packages can ship the native GStreamer runtime.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
servo = { workspace = true, features = ["media-gstreamer"] }

# The location source for pages (`geolocation/core_location.rs`): CoreLocation's
# `CLLocationManager`, in the objc2 0.6 generation the desktop app already uses.
# media-capture: gstreamer is the fake camera and microphone of
# `--fake-media-devices` (`src/fake_media_devices.rs`), a GStreamer device
# provider, in the same release Servo's media backend uses (already in Cargo.lock).
[target.'cfg(target_os = "macos")'.dependencies]
gstreamer = "0.25"
objc2.workspace = true
objc2-core-location = { version = "0.3.2", default-features = false, features = [
    "std",
    "CLError",
    "CLErrorDomain",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSError",
    "NSObject",
    "NSString",
] }

[dev-dependencies]
# a11y-1: the headless-Servo accessibility tests (`tests/a11y_*.rs`, all `#[ignore]`d) read the tree with the
# consumer AccessKit's own adapters use.
accesskit_consumer.workspace = true
# find: runs the find-in-page script's tests in a JavaScript engine written in Rust.
boa_engine.workspace = true
tempfile.workspace = true
