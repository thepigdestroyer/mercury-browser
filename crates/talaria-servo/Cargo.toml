# SPDX-License-Identifier: MPL-2.0
[package]
name = "talaria-servo"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adblock.workspace = true
content-security-policy.workspace = true
dpi.workspace = true
euclid.workspace = true
# openurl
http.workspace = true
log.workspace = true
rustls.workspace = true
# Checks the HTTP disk cache Servo opens (the same rusqlite Servo uses).
rusqlite.workspace = true
serde_json.workspace = true
servo.workspace = true
talaria-core = { path = "../talaria-core" }
url.workspace = true

# The content process's parent watchdog (`content_process.rs`) is Unix-only.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Servo defaults to a no-op media backend. Linux and macOS builds opt into the
# production GStreamer backend so HTML audio/video, Web Audio, and WebRTC have a
# real media pipeline. On macOS the official GStreamer framework is unpacked by
# scripts/macos/gstreamer.sh and its libraries are copied next to the executable
# by scripts/macos/collect-gstreamer.sh. Other platforms keep the no-op backend
# until their release packages can ship the native GStreamer runtime.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
servo = { workspace = true, features = ["media-gstreamer"] }

[build-dependencies]
adblock.workspace = true

# The location source for pages (`geolocation/core_location.rs`): CoreLocation's
# `CLLocationManager`, in the objc2 0.6 generation the desktop app already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-location = { version = "0.3.2", default-features = false, features = [
    "std",
    "CLError",
    "CLErrorDomain",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSError",
    "NSObject",
    "NSString",
] }

[dev-dependencies]
# find: runs the find-in-page script's tests in a JavaScript engine written in Rust.
boa_engine.workspace = true
tempfile.workspace = true
