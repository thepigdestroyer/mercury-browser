[package]
name = "mercury-dnr"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

# The declarativeNetRequest evaluator for browser extensions (EE28): rule parsing, validation and
# limits, URL filters, and an evaluator that turns request metadata into an action or a rewrite.
# No engine and no network: the request hook that calls it lives in talaria-servo (a later lane).
[dependencies]
# `regexFilter`: linear-time matching, with a size limit on every compiled pattern.
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
