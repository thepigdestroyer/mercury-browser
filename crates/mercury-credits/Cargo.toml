[package]
name = "mercury-credits"
description = "Writes credits.html, the licence texts of every crate built into the app, and checks that every crate can be credited"
publish = false
version.workspace = true
edition.workspace = true
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "mercury_credits"
path = "src/lib.rs"

[[bin]]
name = "mercury-credits"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
tempfile.workspace = true
