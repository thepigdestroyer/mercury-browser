#
# What `mercury-credits` cannot find by itself: licence files deeper inside a package (native code
# that a -sys crate compiles into the application), copyright lines for packages that carry no
# licence file, and the licence files a person has read and accepted although the tool does not
# recognise their wording. docs/developer-guide/licence-compliance.md explains each table.
#
# Every `files` path was checked to exist in the package as it is in the cargo registry on
# 19 Nov 2026 (`mercury-credits check` fails when one is missing). Paths are relative to the
# package root. Only the texts of the bundled projects that are compiled into the application are
# named: build tooling inside a package (Python packages, test suites, documentation tools) is not.
#
# A crate that `links` native code and has no `[[extra]]` entry at all gets a warning from
# `mercury-credits check`, so crates that were read and bundle nothing else have an entry with an
# empty `files` list.

# ---------------------------------------------------------------------------------------------
# mozjs_sys 153.7.0-0 (SpiderMonkey; the entries were read in 153.6.0-1, `make credits-check` finds every listed path
# in 153.7.0-0, and the header notices were not re-read for 153.7.0-0). The package root holds no licence file; `mozjs/LICENSE` only
# points at Firefox's `toolkit/content/license.html`, which is not in the package. MPL-2.0 is the
# crate's licence, and the projects below are compiled into `libjs_static`. Not listed on purpose:
#   third_party/python/**, tools/**, testing/**, devtools/**, build/pgo/** and every test directory
#   (build and test tooling); nsprpub/ (NSPR is not part of the standalone engine build);
#   js/src/vtune/ and mozglue/baseprofiler/core/vtune/ (Intel's ittnotify, "GPL-2.0 OR BSD-3-Clause";
#   only built for VTune profiling, and Mercury would take the BSD branch).
# Files inside SpiderMonkey that carry their own notice in the source header (Apache-2.0 for the
# WebAssembly code, BSD-3-Clause for VIXL, BSD-2-Clause for Apple's assembler, MIT for Float16)
# are listed in THIRD-PARTY-NOTICES.md, because the tool can only show whole files.
# ---------------------------------------------------------------------------------------------
[[extra]]
crate = "mozjs_sys"
files = ["mozjs/js/src/irregexp/LICENSE.v8"]
note = "irregexp, the regular-expression engine from the V8 project (js/src/irregexp)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/mfbt/double-conversion/LICENSE"]
note = "double-conversion, number to string conversion (mfbt/double-conversion)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/mozglue/static/lz4/LICENSE"]
note = "LZ4 (mozglue/static/lz4)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/js/src/xsum/LICENSE"]
note = "xsum, exact summation of floating-point numbers, by Radford M. Neal (js/src/xsum)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/js/src/zydis/Zydis/LICENSE", "mozjs/js/src/zydis/Zycore/LICENSE"]
note = "Zydis and Zycore, the x86 disassembler (js/src/zydis); compiled only when the jitspew feature is on"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/modules/fdlibm/src/LICENSE"]
note = "fdlibm, the math functions (modules/fdlibm), from FreeBSD's msun"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/third_party/fmt/LICENSE"]
note = "{fmt}, text formatting (third_party/fmt, compiled into mozglue)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/third_party/function2/LICENSE.txt"]
note = "function2, a move-only function wrapper (third_party/function2)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/third_party/gemmology/LICENSE"]
note = "gemmology, integer matrix multiplication for WebAssembly (third_party/gemmology)"

[[extra]]
crate = "mozjs_sys"
files = ["mozjs/third_party/xsimd/LICENSE"]
note = "xsimd, portable SIMD (third_party/xsimd)"

# The other mozjs crates are Rust glue (MPL-2.0) and bundle nothing else; stylo's Python build
# tooling (properties/vendored_python) runs at build time and ships none of its code.
[[extra]]
crate = "mozjs_collator_glue"
