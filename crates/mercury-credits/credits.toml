[[extra]]
crate = "mozjs_locale_glue"
files = []

[[extra]]
crate = "mozjs_normalizer_glue"
files = []

[[extra]]
crate = "mozjs_properties_glue"
files = []

[[extra]]
crate = "mozjs_unicode_bidi_ffi"
