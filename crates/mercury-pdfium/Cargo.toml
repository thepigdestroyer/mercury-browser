[package]
name = "mercury-pdfium"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

# The PDFium backend of the PDF viewer, and the helper process's entry point (`--pdf-worker`).
# PDFium itself is a prebuilt dynamic library (scripts/macos/pdfium.sh) that this crate loads at run
# time by path; nothing is linked at build time, so the crate builds without it. Light crate.
[dependencies]
mercury-pdf = { path = "../mercury-pdf" }
# Pinned exactly in the workspace; the PDFium release it binds to is named in the root Cargo.toml.
pdfium-render.workspace = true
