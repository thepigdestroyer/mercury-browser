[package]
name = "mercury-devtools"
description = "Mercury Browser's development and CI tools: the test page server and the screenshot checker"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "serve-tests"
path = "src/bin/serve-tests.rs"

[[bin]]
name = "check-colors-screenshot"
path = "src/bin/check-colors-screenshot.rs"

[[bin]]
name = "package-manifest"
path = "src/bin/package-manifest.rs"

[dependencies]
libc.workspace = true
miniz_oxide.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
