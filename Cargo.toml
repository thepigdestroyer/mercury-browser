# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "3"
members = [
    "apps/mercury-desktop",
    "crates/mercury-a11y",
    "crates/mercury-appearance",
    "crates/mercury-credits",
    "crates/mercury-devtools",
    "crates/mercury-downloads",
    "crates/mercury-engine-tests",
    "crates/mercury-filter-lists",
    "crates/mercury-iconset",
    "crates/mercury-import",
    "crates/mercury-mse",
    "crates/mercury-mse-gst",
    "crates/mercury-mse-testkit",
    "crates/mercury-option-keys",
    "crates/mercury-password-manager",
    "crates/mercury-passwords",
    "crates/mercury-pdf",
    "crates/mercury-pdfium",
    "crates/mercury-proxy",
    "crates/mercury-release",
    "crates/mercury-servo-patches",
    "crates/mercury-settings",
    "crates/mercury-site-security",
    "crates/mercury-store",
    "crates/mercury-tab-snapshots",
    "crates/mercury-ui",
    "crates/mercury-view-source",
    "crates/talaria-core",
    "crates/talaria-servo",
]
# Mercury: servo-net is vendored and its tests need dev-dependencies, so they run on the crate's own
# manifest (`make test-servo-net`), as gaol's do; servo-storage's too (`make test-servo-storage`).
exclude = ["third_party/gaol", "third_party/servo-net", "third_party/servo-storage"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0 AND PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# find: tests only (talaria-servo's dev-dependency), for the find-in-page script.
boa_engine = { version = "0.20", default-features = false }
# a11y-1: the page accessibility logic. `accname` and `a11y-dom` (MIT, one author, 0.30.12 of 17 Nov 2026) are
# pinned exactly: they are one week old and release often; read the lane brief's decision D1 before moving them.
a11y-dom = "=0.30.12"
accesskit = "0.24"
# The tree consumer AccessKit's own adapters use; the oracle of the a11y tests (already in the lock through Slint).
accesskit_consumer = "0.38"
accname = "=0.30.12"
adblock = "=0.13.5"
ash = "0.38"
backtrace = "0.3.77"
# hsts-preload (crates/mercury-devtools): decodes Gitiles' base64 form of Chromium's HSTS list.
base64 = "0.22"
content-security-policy = "0.9"
core-foundation = "0.10"
dirs = "7.0"
dpi = "0.1"
# sh-pages: the page text is decoded with the charset the server or the page names.
encoding_rs = "0.8"
euclid = "0.22"
# hsts-preload: the map format Servo reads for its HSTS preload list (already in the lock through servo-net).
fst = "0.4"
futures-util = "0.3.34"
getrandom = "0.4"
gleam = "0.15"
glow = "0.17"
# openurl: the status and headers of refused loads (already in the lock through Servo).
http = "1.5"
httpdate = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.191"
log = "0.4"
mime_guess = "2.0.5"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false }
# pdf-viewer: the Rust binding to PDFium, which is loaded at run time (scripts/macos/pdfium.sh). The
# bindings generation is named after the PDFium release it was made for, so the pinned binary must
# be that release or one close enough to bind (the worker checks this with the real library). No
# `pdfium_enable_v8` or `pdfium_enable_xfa`: the pinned build has neither (decision OD-11).
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
resvg = { version = "0.48", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
security-framework = "3.7"
serde = "1"
serde_json = "1"
sha2 = "0.10"
# The `vello` (GPU canvas) feature is on through the vendored fix in `third_party/servo-canvas`:
# servo-canvas 0.8.0's vello backend does not compile against wgpu 30 as published
# (`vello_backend.rs:756`, `get_mapped_range` returns a `Result`). See its MERCURY.md.
# The build therefore carries two `wgpu` majors: 29 for Slint's FemtoVG renderer (Slint is held at
# 1.17, see below) and 30 for vello 0.11, which Servo's GPU canvas requires. They do not share state.
servo = { version = "=0.8.0", features = [
    "vello",
    "webgl",
    "subtlecrypto",
    "brotli-compression-stream",
] }
# Slint is held at 1.17: i-slint-compiler 1.18 needs icu_properties ^2.2, while Servo 0.8.0's
# mozjs_sys pins icu_capi =2.1.2 (icu_properties ~2.1). Move to 1.18 when one of them relaxes its pin.
slint = { version = "~1.17.1", default-features = false, features = [
    # a11y-base: hands the chrome's accessibility tree to the system (AccessKit; VoiceOver on
    # macOS). It adds accesskit_winit and the platform adapters to Cargo.lock, and no other feature.
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg-wgpu",
    "std",
    "unstable-wgpu-29",
    "unstable-winit-030",
] }
slint-build = "~1.17.1"
# Slint's own testing backend (tests only). Its version must be exactly the `slint` version above:
# it shares Slint's internal crates. Move both together.
i-slint-backend-testing = "=1.17.1"
signal-hook-registry = "1.4.8"
surfman = "0.14"
tempfile = "3.27"
thiserror = "2"
tokio = "1.54.1"
# sh-pages: view source highlights HTML, JavaScript and CSS with tree-sitter (MIT, C core; the
# grammars depend only on tree-sitter-language, so they work with core 0.27). `tree-sitter` itself
# is a dev-dependency of mercury-view-source (it parses the generated pages in tests).
tree-sitter = "0.27"
tree-sitter-css = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
url = "2.5"
zeroize = "1.9"

# The vendored crates (third_party/vendor.toml; `mercury-servo-patches vendor` adds entries here).
# Never make them workspace members or path dependencies: `cargo fmt --all` formats both, and
# clippy lints members. `make servo-patches-check` fails if either happens.
[patch.crates-io]
gaol = { path = "third_party/gaol" }
i-slint-backend-winit = { path = "third_party/i-slint-backend-winit" }
servo = { path = "third_party/servo" }
servo-canvas = { path = "third_party/servo-canvas" }
servo-config = { path = "third_party/servo-config" }
servo-constellation = { path = "third_party/servo-constellation" }
servo-constellation-traits = { path = "third_party/servo-constellation-traits" }
# site-security: Mercury registers its own resource reader (third_party/servo-default-resources/MERCURY.md).
servo-default-resources = { path = "third_party/servo-default-resources" }
servo-embedder-traits = { path = "third_party/servo-embedder-traits" }
servo-layout = { path = "third_party/servo-layout" }
servo-layout-api = { path = "third_party/servo-layout-api" }
servo-media = { path = "third_party/servo-media" }
servo-media-gstreamer = { path = "third_party/servo-media-gstreamer" }
servo-media-player = { path = "third_party/servo-media-player" }
servo-media-streams = { path = "third_party/servo-media-streams" }
servo-media-webrtc = { path = "third_party/servo-media-webrtc" }
servo-net = { path = "third_party/servo-net" }
servo-net-traits = { path = "third_party/servo-net-traits" }
servo-script = { path = "third_party/servo-script" }
servo-script-bindings = { path = "third_party/servo-script-bindings" }
servo-script-webcrypto = { path = "third_party/servo-script-webcrypto" }
servo-storage = { path = "third_party/servo-storage" }
servo-storage-traits = { path = "third_party/servo-storage-traits" }
servo-webgl = { path = "third_party/servo-webgl" }
stylo_static_prefs = { path = "third_party/stylo_static_prefs" }
surfman = { path = "third_party/surfman" }

# Keep the controller easy to debug while optimizing the browser-engine, frame-transfer, and media
# hotspots used by `make run`. Targeting the complete dependency graph would also rebuild large
# native build tools such as SpiderMonkey and ANGLE whenever this profile changes.
[profile.dev.package.adblock]
opt-level = 2

[profile.dev.package.mercury-desktop]
opt-level = 2

[profile.dev.package.servo]
opt-level = 2

[profile.dev.package."servo-constellation"]
opt-level = 2

[profile.dev.package."servo-layout"]
opt-level = 2

[profile.dev.package."servo-net"]
opt-level = 2

[profile.dev.package."servo-paint"]
opt-level = 2

[profile.dev.package."servo-script"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer-render"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer-render-unix"]
opt-level = 2

[profile.dev.package.surfman]
opt-level = 2

[profile.dev.package."talaria-servo"]
opt-level = 2

[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_cpu]
opt-level = 2

[profile.dev.package.webrender]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package."wgpu-core"]
opt-level = 2

[profile.dev.package."wgpu-hal"]
opt-level = 2
