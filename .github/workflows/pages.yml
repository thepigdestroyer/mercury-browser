# Builds the MkDocs site (`make docs`, strict) and publishes it on GitHub
# Pages, https://thepigdestroyer.github.io/mercury-browser/. The repository's
# Pages source must be "GitHub Actions" (Settings → Pages → Build and
# deployment → Source); see docs/developer-guide/continuous-integration.md.
name: Documentation site

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read-only by default; only the deploying job gets what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  # Let a deployment that has started finish; a newer push queues behind it.
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        # Writes the site to target/mkdocs (site_dir in mkdocs.yml).
        run: make docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/mkdocs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # deploy-pages: `pages: write` publishes, and the OIDC token
    # (`id-token: write`) proves the deployment comes from this workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
