#
# THROW-AWAY. The arm64 probe of the GstMSE spike (lane sp-mse, R17 section 9). It exists on the branch
# lane/sp-mse only and is deleted in the lane's last commit, before the lane merges: it must never reach
# `mercury` or `master`. It runs the spike's scenario binaries on GitHub's Apple Silicon runner and prints
# their JSON reports to the log. No secrets, read-only token, nothing is uploaded or published.
name: MSE spike arm64 probe

on:
  push:
    branches: [lane/sp-mse]
    paths:
      - 'spikes/mse/**'
      - '.github/workflows/mse-spike-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mse-spike-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: GstMSE on Apple Silicon
    # macos-26 is the same arm64 image (3 M1 cores, 7 GB) as ci.yml's macOS job.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the machine
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install
          rustc --version
          cargo --version

      - name: Restore the GStreamer packages
        id: gstreamer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/mercury-browser/gstreamer/**/*.pkg
          key: gstreamer-macos-arm64-${{ hashFiles('scripts/macos/gstreamer.sh') }}

      - name: Fetch and verify the GStreamer packages
        run: scripts/macos/gstreamer.sh fetch

      - name: Save the GStreamer packages
        if: steps.gstreamer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/mercury-browser/gstreamer/**/*.pkg
          key: ${{ steps.gstreamer-cache.outputs.cache-primary-key }}

      - name: Unpack and check GStreamer
        run: make gstreamer-macos

      - name: Build the spike
        shell: bash
        run: |
          set -euo pipefail

          spikes/mse/run.sh build --release --locked --workspace --all-targets

      # One source buffer with audio and video: the case that plays on Intel.
      - name: The minimal prototype, muxed
        shell: bash
        run: |
          set -uo pipefail

          for shape in playbin bare; do
            echo "=== minimal --muxed --shape ${shape}"
            spikes/mse/run.sh run --release --locked -p mse-rig --example minimal -- --muxed --shape "${shape}" || echo "exit status $?"
          done

      # Two source buffers: the case that deadlocks GstMSE on Intel (the example gives up after 15 s).
      - name: The minimal prototype, split audio and video
        shell: bash
        run: |
          set -uo pipefail

          for shape in playbin bare; do
            echo "=== minimal (split A/V) --shape ${shape}"
            spikes/mse/run.sh run --release --locked -p mse-rig --example minimal -- --shape "${shape}" --wait 5 || echo "exit status $?"
          done

      - name: Conformance scenarios C01 to C15
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "${RUNNER_TEMP}/mse"
          for shape in playbin bare; do
            spikes/mse/run.sh run --release --locked -p mse-conformance -- \
              --shape "${shape}" --plugin-mode system --report "${RUNNER_TEMP}/mse/conformance-${shape}.json" || echo "exit status $?"
          done

      - name: Stress scenarios T01 to T12 (video only, as on Intel)
        shell: bash
        env:
          MSE_STRESS_TRACKS: video
        run: |
          set -uo pipefail

          mkdir -p "${RUNNER_TEMP}/mse"
          spikes/mse/run.sh run --release --locked -p mse-stress -- \
            --shape playbin --plugin-mode system --report "${RUNNER_TEMP}/mse/stress-playbin.json" || echo "exit status $?"
          spikes/mse/run.sh run --release --locked -p mse-stress -- \
            --shape bare --plugin-mode system --only T01,T02,T04,T05 --report "${RUNNER_TEMP}/mse/stress-bare.json" || echo "exit status $?"

      - name: Print the reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          for report in "${RUNNER_TEMP}"/mse/*.json; do
            echo "=== ${report##*/}"
            cat "${report}"
            echo
          done
